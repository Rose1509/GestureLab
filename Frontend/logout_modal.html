<!-- Logout confirmation modal - include before </body> -->
<div id="logoutModal" class="logout-modal-overlay" aria-modal="true" aria-labelledby="logoutModalTitle" role="dialog">
    <div class="logout-modal-card">
        <div class="logout-modal-body">
            <div class="logout-modal-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </div>
            <h2 id="logoutModalTitle" class="logout-modal-title">Are you sure you want to logout?</h2>
            <p class="logout-modal-message">You will need to sign in again to access your account.</p>
            <div class="logout-modal-actions">
                <button type="button" class="logout-modal-btn logout-modal-btn-cancel" id="logoutModalCancel">Cancel</button>
                <button type="button" class="logout-modal-btn logout-modal-btn-confirm" id="logoutModalConfirm">Logout</button>
            </div>
        </div>
    </div>
</div>
<script>
(function() {
    var overlay = document.getElementById('logoutModal');
    var cancelBtn = document.getElementById('logoutModalCancel');
    var confirmBtn = document.getElementById('logoutModalConfirm');
    var logoutHref = '/logout';

    function openLogoutModal(e) {
        var a = e.target.closest('a[href="/logout"]');
        if (a) {
            e.preventDefault();
            e.stopPropagation();
            logoutHref = a.getAttribute('href') || '/logout';
            overlay.classList.add('is-open');
            document.body.style.overflow = 'hidden';
            if (cancelBtn) cancelBtn.focus();
        }
    }

    function closeLogoutModal() {
        overlay.classList.remove('is-open');
        document.body.style.overflow = '';
    }

    function doLogout() {
        closeLogoutModal();
        window.location.href = logoutHref;
    }

    if (overlay) {
        if (cancelBtn) cancelBtn.addEventListener('click', closeLogoutModal);
        if (confirmBtn) confirmBtn.addEventListener('click', doLogout);
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) closeLogoutModal();
        });
        document.addEventListener('keydown', function(e) {
            if (overlay.classList.contains('is-open') && e.key === 'Escape') closeLogoutModal();
        });
        document.addEventListener('click', openLogoutModal, true);
    }
})();
</script>
