<!-- Delete confirmation modal - include on dashboard, add_lessons, add_quizzes -->
<div id="deleteModal" class="delete-modal-overlay" aria-modal="true" aria-labelledby="deleteModalTitle" role="dialog">
    <div class="delete-modal-card">
        <div class="delete-modal-body">
            <div class="delete-modal-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    <line x1="10" y1="11" x2="10" y2="17"/>
                    <line x1="14" y1="11" x2="14" y2="17"/>
                </svg>
            </div>
            <h2 id="deleteModalTitle" class="delete-modal-title">Confirm delete</h2>
            <p id="deleteModalMessage" class="delete-modal-message">Are you sure you want to delete this?</p>
            <div class="delete-modal-actions">
                <button type="button" class="delete-modal-btn delete-modal-btn-cancel" id="deleteModalCancel">Cancel</button>
                <button type="button" class="delete-modal-btn delete-modal-btn-confirm" id="deleteModalConfirm">Delete</button>
            </div>
        </div>
    </div>
</div>
<script>
(function() {
    var overlay = document.getElementById('deleteModal');
    var messageEl = document.getElementById('deleteModalMessage');
    var cancelBtn = document.getElementById('deleteModalCancel');
    var confirmBtn = document.getElementById('deleteModalConfirm');
    var pendingForm = null;

    function openDeleteModal(form, message) {
        if (!form || !message) return;
        pendingForm = form;
        if (messageEl) messageEl.textContent = message;
        overlay.classList.add('is-open');
        document.body.style.overflow = 'hidden';
        if (cancelBtn) cancelBtn.focus();
    }

    function closeDeleteModal() {
        overlay.classList.remove('is-open');
        document.body.style.overflow = '';
        pendingForm = null;
    }

    function confirmDelete() {
        if (pendingForm) {
            var form = pendingForm;
            closeDeleteModal();
            form.submit();
        } else {
            closeDeleteModal();
        }
    }

    if (overlay) {
        if (cancelBtn) cancelBtn.addEventListener('click', closeDeleteModal);
        if (confirmBtn) confirmBtn.addEventListener('click', confirmDelete);
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) closeDeleteModal();
        });
        document.addEventListener('keydown', function(e) {
            if (overlay.classList.contains('is-open') && e.key === 'Escape') closeDeleteModal();
        });
        document.addEventListener('submit', function(e) {
            var form = e.target;
            if (form && form.classList && form.classList.contains('js-delete-form')) {
                var msg = form.getAttribute('data-delete-message');
                if (msg) {
                    e.preventDefault();
                    e.stopPropagation();
                    openDeleteModal(form, msg);
                }
            }
        }, true);
    }
})();
</script>
