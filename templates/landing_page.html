<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn ASL | Gesture Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/landing_page.css">
</head>
<body>

    <header class="landing-header">
        <a href="/" class="logo-link">
            <img src="/static/images/logo.png" alt="Gesture Lab" class="logo-img">
            <span class="logo-text">Gesture Lab</span>
        </a>
    </header>

    <main class="landing-main">
        <div class="landing-hero">
            <p class="hero-lead">Learn at your own pace · Hands-on practice</p>
            <h1 class="hero-title">Learn American<br><span class="hero-title-accent">Sign Language</span></h1>
            <p class="hero-tagline">A language that feels like connection.</p>
            <div class="hero-actions">
                <a href="/register" class="btn-primary">Get Started</a>
                <p class="login-prompt">Already have an account? <a href="/login">Log in</a></p>
            </div>
        </div>

        <section class="illustration-section">
            <div class="illustration-card">
                <img src="/static/images/people_sign.png" alt="People communicating in ASL">
            </div>
        </section>
    </main>

</body>
</html>
