<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Learn. Sign. Connect.</title>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/forgot_password.css">
</head>
<body>

<div class="main-card">
    <div class="left-panel">
        <div class="logo">
            <img src="/static/images/logo_white.png" alt="Logo" height="100" width="80">
        </div>

        <div class="illustration-container">
            <img src="/static/images/login_scr.png" alt="People Signing">
        </div>

        <p class="brand-text">Learn. Sign. Connect.</p>
    </div>

    <div class="right-panel">
        <div class="password-box">
            <h2>Forgot Password?</h2>
            <p class="subtitle">Reset your password</p>

            <form action="/forgot-password" method="post">
                <input type="email" name="email" placeholder="Enter your email address" required value="{{ email or '' }}" {% if stage == 'verify' %}readonly{% endif %}>

                {% if stage == 'verify' %}
                    <input type="hidden" name="action" value="verify">
                    <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter 6-digit code" required>
                    <input type="password" name="new_password" placeholder="New Password" required>
                    <input type="password" name="confirm_password" placeholder="Confirm Password" required>
                {% else %}
                    <input type="hidden" name="action" value="request">
                {% endif %}

                <!-- Error message placeholder -->
                {% if error %}
                    <p class="error-message">{{ error }}</p>
                {% endif %}

                <!-- Success message placeholder -->
                {% if success %}
                    <p class="success-message">{{ success }}</p>
                {% endif %}

                {% if stage == 'verify' %}
                    <button type="submit" class="submit-btn">Verify & Reset Password</button>
                    <button type="submit" class="submit-btn" style="background:#64748b; margin-top: 10px;" name="action" value="resend">
                        Resend Code
                    </button>
                {% else %}
                    <button type="submit" class="submit-btn">Send Code</button>
                {% endif %}

                <div class="back-to-login">
                    <a href="/login">Back to Login</a>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
